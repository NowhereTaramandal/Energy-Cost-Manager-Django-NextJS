services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: energy_manager
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: docker-dev-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      POSTGRES_DB: energy_manager
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports: ["8000:8000"]
    depends_on: [db]
    command: sh -c "python manage.py migrate && python manage.py seed_energy_plans && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
